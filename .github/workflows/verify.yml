name: Verify matrix data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate data contract
        run: python scripts/verify.py

      - name: Check public source links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/verify.py --check-links
